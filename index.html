<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #14213d;
    padding: 18px 50px;
}

.logo {
    color: white;
    font-size: 26px;
    font-weight: bold;
}

.nav-links {
    display: flex;
    list-style: none;
    gap: 30px;
}

.nav-links a {
    color: white;
    text-decoration: none;
    font-size: 16px;
    transition: 0.3s;
}

.nav-links a:hover {
    color: #fca311;
}

.nav-btn {
    background-color: #fca311;
    color: #14213d;
    padding: 10px 20px;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
}

.nav-btn:hover {
    background-color: white;
}


    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">MyWebsite</div>

    <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About Us</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Courses</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <a href="#" class="nav-btn">Get Started</a>
</nav>

    <h1> this is my first heading</h1>
    <img src=london.JFIF>
    
</body>

</html>
